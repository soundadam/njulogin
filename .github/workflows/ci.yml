name: CI

on:
  push:
    branches:
      - main
      - "iteration/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mirrors the local gate in CLAUDE.md.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Go 1.27.2 export data needs go-tools f1838cc (x/tools v0.51.0), which no
      # staticcheck release contains yet; this pins the master commit after it.
      STATICCHECK_VERSION: v0.7.0-0.dev.0.20261009230814-452d5bb86b45
      ACTIONLINT_VERSION: v1.7.12
      GOVULNCHECK_VERSION: v1.6.0
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify pinned Go toolchain
        run: |
          set -euo pipefail
          go version
          test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" { print $2 }' go.mod)"
          ruby --version

      - name: Install pinned validation tools
        run: |
          set -euo pipefail
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

          go_bin="$(go env GOPATH)/bin"
          echo "$go_bin" >> "$GITHUB_PATH"
          export PATH="$go_bin:$PATH"

          tools_dir="$RUNNER_TEMP/njulogin-tools"
          mkdir -p "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"

          archive="shellcheck-${SHELLCHECK_VERSION}.tar.xz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "$archive"
          install -m 0755 \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck" \
            "$tools_dir/shellcheck"

          export PATH="$tools_dir:$PATH"

          staticcheck -version
          actionlint -version
          govulncheck -version
          shellcheck --version

      - name: Run release gate
        run: make release-check
